services:
  look-up:
    build: .
    container_name: look-up
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      # config.json, caches, and your own photo library (data/images/...)
      - ./data:/data
    environment:
      TZ: America/Los_Angeles
      # Uncomment to require a password for changing settings in /admin
      # ADMIN_PASSWORD: change-me
      # First-run defaults (ignored once data/config.json exists; edit in /admin instead)
      # RECEIVER_LAT: "47.6062"
      # RECEIVER_LON: "-122.3321"
      # SOURCE_URL: http://raspberrypi.local/tar1090/data/aircraft.json
      # Plain-English summaries of air traffic control radio (optional; see README)
      # ANTHROPIC_API_KEY: sk-ant-...

  # Speech-to-text for the air traffic control radio feature (optional).
  # Built from source so it runs on CPUs without AVX2 and on the Raspberry Pi.
  # The first start downloads the model (~490 MB for small.en) into ./data/whisper.
  whisper:
    build: ./whisper
    container_name: look-up-whisper
    restart: unless-stopped
    volumes:
      - ./data/whisper:/models
    environment:
      WHISPER_MODEL: small.en
      WHISPER_THREADS: '8'
